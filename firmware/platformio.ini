; Cozmo replica robot firmware (ESP32, Arduino framework, C++17)
;
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor
;
; WiFi credentials live in include/secrets.h (copy include/secrets.example.h).

[platformio]
default_envs = esp32dev

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -DCORE_DEBUG_LEVEL=2
lib_deps =
    bblanchon/ArduinoJson@^7.2.0

; Classic ESP32 DevKit (ESP32-WROOM-32, 38 pin). This is the reference board.
[env:esp32dev]
board = esp32dev
board_build.partitions = min_spiffs.csv
